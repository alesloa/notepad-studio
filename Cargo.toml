[workspace]
resolver = "2"
exclude = ["vendor/xim"]
members = [
    ".",
    "crates/notepad-studio-plugin",
    "crates/sample-uppercase-plugin",
    # Vendored gpui + its Apache-2.0 support crates (self-contained, no external dep).
    "vendor/gpui/crates/collections",
    "vendor/gpui/crates/gpui",
    "vendor/gpui/crates/gpui_macros",
    "vendor/gpui/crates/http_client",
    "vendor/gpui/crates/media",
    "vendor/gpui/crates/refineable",
    "vendor/gpui/crates/refineable/derive_refineable",
    "vendor/gpui/crates/sum_tree",
    "vendor/gpui/crates/util",
    "vendor/gpui/crates/util_macros",
    "vendor/gpui/tooling/perf",
]

[workspace.package]
# Default for crates using `edition.workspace` — the vendored gpui crates
# require 2024. Notepad Studio's own crates set `edition = "2021"` explicitly,
# so this 2024 default applies only to the vendored crates.
edition = "2024"
license = "Apache-2.0"
authors = ["Notepad Studio contributors"]

[package]
name = "notepad-studio"
version = "0.0.5"
edition = "2021"
license = "Apache-2.0"
description = "Lightweight cross-platform text editor inspired by Notepad++, written in Rust."
authors = ["Notepad Studio contributors"]
readme = "README.md"
repository = "https://github.com/alesloa/notepad-studio"
keywords = ["editor", "text-editor", "notepad", "gui"]
categories = ["text-editors", "gui"]
build = "build.rs"

[[bin]]
name = "notepad-studio"
path = "src/main.rs"

# Embed assets/icon.ico into the .exe on Windows so Explorer / taskbar / Alt-Tab
# pick up the app icon without a wrapper (no .exe-side bundling story exists).
# No-op on macOS / Linux — the build.rs guards on target_os.
[build-dependencies]
embed-resource = "3"

# `cargo bundle` reads this on macOS to drop assets/icon.icns into the .app's
# Resources/ and reference it from Info.plist. Dev-mode `cargo run` does NOT
# build a bundle, so the Dock falls back to the generic terminal-process icon
# until GPUI exposes a window-icon API (see UNTESTED 20.2 known caveats).
[package.metadata.bundle]
name = "Notepad Studio"
identifier = "io.alesloa.notepad-studio"
icon = ["assets/icon.icns"]
category = "public.app-category.developer-tools"
short_description = "Lightweight cross-platform text editor inspired by Notepad++."

# gpui is vendored in-repo (vendor/gpui) so the project is fully self-contained —
# no external checkout required. See vendor/gpui/ + NOTICE.
[dependencies]
futures = { workspace = true }
tempfile = { workspace = true }
sha2 = { workspace = true }
gpui = { path = "vendor/gpui/crates/gpui" }
ropey = "1.6"
harper-core = { version = "=0.33.0", default-features = false, features = ["concurrent"] }
rfd = { version = "0.14", features = ["common-controls-v6"] }
anyhow = "1"
dirs = "5"
serde = { version = "1", features = ["derive", "rc"] }
serde_json.workspace = true
toml = "0.8"
regex = "1"
walkdir = "2"
uuid = { version = "1", features = ["v4", "serde"] }
encoding_rs = "0.8"
libloading = "0.8"
trash = "5"
renamore = "=0.3.2"
chrono = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
open = { version = "5", features = ["shellexecute-on-windows"] }
quick-xml = "0.36"
docx-rust = "0.1.11"
scrivener-rtf = "0.1"
cfb = "0.14"
csv = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
thiserror = "1"
notepad-studio-plugin = { path = "crates/notepad-studio-plugin" }

# Syntax highlighting via tree-sitter. Keep all language grammar versions
# pinned to ones that build against the tree-sitter core below.
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-c = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.23"
tree-sitter-md = "0.3"
tree-sitter-bash = "0.25.1"
tree-sitter-powershell = "0.26.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-swift = "0.7.2"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-lua = "0.5.0"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-scss = "1.0.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-xml = "0.7.0"
tree-sitter-sequel = "0.3.11"

[dev-dependencies]
futures = { workspace = true }
gpui = { path = "vendor/gpui/crates/gpui", features = ["test-support"] }

# macOS-only NSPasteboard bridge for reading public.html / public.rtf flavors
# during paste — GPUI's clipboard API only exposes string/image, so the paste-
# with-formatting flow reaches past it through these crates. Pinned to the same
# versions as the vendored gpui so the symbol surface matches.
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.0"
cocoa-foundation = "=0.2.0"
objc = "0.2"

# Linux-only POSIX `nl_langinfo` bridge for Edit ▸ Insert ▸ Date/Time Short.
# Pulls the user's locale short-date / short-time patterns so the inserted
# stamp matches what the rest of the OS shows (date pickers, clocks, etc.).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
file-id = "=0.2.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# ---------------------------------------------------------------------------
# Vendored gpui workspace plumbing (see vendor/gpui + NOTICE). These crates
# are members of this workspace and inherit deps/lints from here.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

